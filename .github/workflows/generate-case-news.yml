name: Registrar novedades de casos

on:
  push:
    branches: [main]
    paths:
      - 'src/content/cases/**'

permissions:
  contents: write

jobs:
  generate-news:
    # Los commits de este flujo se realizan con GITHUB_TOKEN y no disparan otro
    # workflow de push. Esta condición es una segunda protección ante duplicados.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el contenido actualizado
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar dependencias del generador
        run: npm ci

      - name: Generar novedades para casos creados o modificados
        run: node scripts/generate-case-news.mjs "${{ github.event.before }}" "${{ github.sha }}"

      - name: Confirmar novedades generadas
        run: |
          if test -z "$(git status --porcelain -- src/content/novedades)"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/content/novedades
          git commit -m "news: registrar actualización de caso"
          git push
